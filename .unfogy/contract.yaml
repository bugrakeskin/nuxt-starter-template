contractVersion: 1

# Static build/runtime compatibility metadata, not installation desired state.
# Generated projects must review their copied tooling and identity explicitly.
application:
  root: /
  nodeMajor: 22
  packageManager: pnpm@12.4.1

versioning:
  scheme: semver
  source: package-json
  verification: .unfogy/versioning.json
  releaseChannel: runtime-config
  immutableArtifact: commit-sha-and-digest

tools:
  contractVerifier: .unfogy/scripts/verify-contract.mjs
  harborScanVerifier: .unfogy/scripts/verify-harbor-scan.mjs

runtime:
  healthEndpoint: /api/health
  requiredEnvironment:
    public:
      - NUXT_PUBLIC_APP_NAME
      - NUXT_PUBLIC_SUPABASE_URL
      - NUXT_PUBLIC_SUPABASE_KEY
    migration:
      - SUPABASE_DB_URL

commands:
  build: pnpm build
  lint: pnpm lint
  typecheck: pnpm typecheck
  test: pnpm test
  smoke: pnpm smoke
  migrate: pnpm db:migrate

delivery:
  contractVersion: 3
  profile: unfogy-buildx-harbor-v1
  sourceRef: main
  dockerfile: Dockerfile
  workflows:
    - .unfogy/woodpecker/validate.yaml
    - .unfogy/woodpecker/publish.yaml
  buildAuthority: woodpecker-dockerfile
  artifactAuthority: harbor-immutable-image
  runtimeAuthority: coolify-docker-image
  runtime:
    start: node scripts/runtime-entrypoint.mjs
    migrate: node .output/migrate.mjs
    processRoleEnvironment: UNFOGY_PROCESS_ROLE
    roles:
      - web
      - migration-runner

features:
  auth: true
  database: true
  realtime: false
  storage: false
  privilegedClient: false
