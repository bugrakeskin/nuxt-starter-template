# Template only: replace every __PLACEHOLDER__ in both manifests before provisioning.
version: 1
repository:
  id: __REPOSITORY_ID__
  remote: https://github.com/__GITHUB_OWNER__/__REPOSITORY_ID__.git
server: localhost
project: __PROJECT_ID__
imageRepository: registry.unfogy.com/__REPOSITORY_ID__/app
runtime:
  port: 3000
  healthPath: /api/health
  healthCommand: node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
ci:
  repository: __GITHUB_OWNER__/__REPOSITORY_ID__
  sourceRef: main
  workflows:
    - .unfogy/woodpecker/validate.yaml
    - .unfogy/woodpecker/publish.yaml
variables:
  NUXT_PUBLIC_APP_NAME: __APP_NAME__
database:
  type: supabase
  studioAccess: private
  migrations: supabase/migrations
  migrateEntrypoint: .output/migrate.mjs
  backup:
    region: ""
    endpoint: ""
    prefix: ""
  applicationBindings:
    NUXT_PUBLIC_SUPABASE_URL: api-url
    NUXT_PUBLIC_SUPABASE_KEY: anon-key
  requiredSecrets:
    - SERVICE_PASSWORD_POSTGRES
    - SERVICE_PASSWORD_JWT
    - SERVICE_SUPABASEANON_KEY
    - SERVICE_SUPABASESERVICE_KEY
    - SERVICE_PASSWORD_ADMIN
    - SERVICE_PASSWORD_PGMETACRYPTO
    - SERVICE_PASSWORD_LOGFLARE
    - SERVICE_PASSWORD_LOGFLAREPRIVATE
    - SERVICE_USER_MINIO
    - SERVICE_PASSWORD_MINIO
    - SERVICE_PASSWORD_SUPAVISORSECRET
    - SERVICE_PASSWORD_VAULTENC
  variables:
    SERVICE_USER_ADMIN: admin
    DISABLE_SIGNUP: "true"
    ENABLE_PHONE_SIGNUP: "false"
    SMTP_HOST: "{{environment.SMTP_HOST}}"
    SMTP_PORT: "465"
    SMTP_USER: "{{environment.SMTP_USER}}"
    SMTP_PASS: "{{environment.SMTP_PASSWORD}}"
    SMTP_ADMIN_EMAIL: "{{environment.SMTP_USER}}"
    SMTP_SENDER_NAME: __APP_NAME__
environments:
  preview:
    application: __APP_NAME__ preview
    domains:
      - __PREVIEW_APP_DOMAIN__
    variables: {}
    database:
      name: __PROJECT_ID__-preview-db
      apiDomain: __PREVIEW_API_DOMAIN__
      studioDomain: __PREVIEW_STUDIO_DOMAIN__
      variables:
        API_EXTERNAL_URL: https://__PREVIEW_API_DOMAIN__
        GOTRUE_SITE_URL: https://__PREVIEW_APP_DOMAIN__
        ADDITIONAL_REDIRECT_URLS: https://__PREVIEW_APP_DOMAIN__/confirm
  production:
    application: __APP_NAME__ production
    domains:
      - __PRODUCTION_APP_DOMAIN__
    variables: {}
    database:
      name: __PROJECT_ID__-production-db
      apiDomain: __PRODUCTION_API_DOMAIN__
      studioDomain: __PRODUCTION_STUDIO_DOMAIN__
      variables:
        API_EXTERNAL_URL: https://__PRODUCTION_API_DOMAIN__
        GOTRUE_SITE_URL: https://__PRODUCTION_APP_DOMAIN__
        ADDITIONAL_REDIRECT_URLS: https://__PRODUCTION_APP_DOMAIN__/confirm
