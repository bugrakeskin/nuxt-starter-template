# Allocation-free template. Provisioning materializes this file in a Project repo.
schema_version: 2
kind: UnfogyProjectConfig
customer_id: __CUSTOMER_ID__
project_id: __PROJECT_ID__
origin_mwo_ref: __MWO_ID__
shortname: __SHORTNAME__
starter:
  name: nuxt-supabase
  version: v1
environments:
  preview:
    application_target: __CUSTOMER_SERVER__
    database_target: __CUSTOMER_SERVER__
    domains:
      aliases:
        - __SHORTNAME__-preview.unfogy.com
    migration: required
    health: /api/health
  production:
    application_target: __CUSTOMER_SERVER__
    database_target: __CUSTOMER_SERVER__
    domains:
      aliases: []
    migration: required
    health: /api/health
