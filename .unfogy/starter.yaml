contractVersion: 1
runtime:
  healthEndpoint: /api/health
  requiredEnvironment:
    public:
      - NUXT_PUBLIC_APP_NAME
      - NUXT_PUBLIC_SUPABASE_URL
      - NUXT_PUBLIC_SUPABASE_KEY
    migration:
      - SUPABASE_DB_URL
commands:
  build: pnpm build
  lint: pnpm lint
  typecheck: pnpm typecheck
  test: pnpm test
  smoke: pnpm smoke
  migrate: pnpm db:migrate
delivery:
  contractVersion: 3
  dockerfile: Dockerfile
  workflows:
    - .woodpecker/validate.yaml
    - .woodpecker/publish.yaml
  runtime:
    start: node scripts/runtime-entrypoint.mjs
    migrate: node .output/migrate.mjs
    processRoleEnvironment: UNFOGY_PROCESS_ROLE
    roles:
      - web
      - migration-runner
features:
  auth: true
  database: true
  realtime: false
  storage: false
  privilegedClient: false
