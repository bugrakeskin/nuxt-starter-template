contractVersion: 1
runtime:
  healthEndpoint: /api/health
  requiredEnvironment:
    public:
      - NUXT_PUBLIC_APP_NAME
      - NUXT_PUBLIC_SUPABASE_URL
      - NUXT_PUBLIC_SUPABASE_KEY
    migration:
      - SUPABASE_DB_URL
commands:
  build: pnpm build
  lint: pnpm lint
  typecheck: pnpm typecheck
  test: pnpm test
  smoke: pnpm smoke
  migrate: pnpm db:migrate
delivery:
  contractVersion: 2
  dockerfile: Dockerfile
  workflows:
    - .woodpecker/validate.yaml
    - .woodpecker/preview.yaml
    - .woodpecker/main.yaml
    - .woodpecker/bootstrap-canary.yaml
  runtime:
    start: node .output/server/index.mjs
    migrate: node .output/migrate.mjs
features:
  auth: true
  database: true
  realtime: false
  storage: false
  privilegedClient: false
