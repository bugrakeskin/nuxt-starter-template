name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    env:
      NUXT_PUBLIC_SUPABASE_URL: https://staging-api.unfogy.com
      NUXT_PUBLIC_SUPABASE_KEY: ci-publishable-key

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Verify starter contract
        run: pnpm run contract:verify

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Smoke
        run: |
          node .output/server/index.mjs &
          pnpm run smoke
