depends_on:
  - validate
when:
  - event: push
    branch: main
    path:
      include:
        - .unfogy/runtime-release.json
  - event: manual
    branch: main
steps:
  - name: verify-runtime-release
    image: node@sha256:dd9d21971ec4395903fa6143c2b9267d048ae01ca6d3ea96f16cb30df6187d94
    commands:
      - apt-get update && apt-get install --yes --no-install-recommends git
      - if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then git fetch --no-tags --unshallow origin; fi
      - git fetch --no-tags --tags origin main
      - node .unfogy/scripts/verify-version.mjs --ci --image
  - name: publish-image
    image: woodpeckerci/plugin-docker-buildx@sha256:0a8e69cad4a25d641bdb51daea53ce309692c7bda1193ae04a990bb88486edd8
    dns: 10.77.30.1
    privileged: true
    settings:
      custom_dns: 10.77.30.1
      registry: registry.unfogy.com
      repo: registry.unfogy.com/${CI_REPO_NAME}/app
      tags:
        - ${CI_COMMIT_SHA}
      platforms: linux/amd64
      provenance: mode=max
      build_args: BUILD_REVISION=${CI_COMMIT_SHA}
      cache_images:
        - registry.unfogy.com/${CI_REPO_NAME}/cache-stable
      username:
        from_secret: harbor_app_push_username
      password:
        from_secret: harbor_app_push_password
  - name: verify-harbor-scan
    image: node@sha256:dd9d21971ec4395903fa6143c2b9267d048ae01ca6d3ea96f16cb30df6187d94
    dns: 10.77.30.1
    environment:
      HARBOR_PROJECT: ${CI_REPO_NAME}
      HARBOR_REPOSITORY: app
      HARBOR_REFERENCE: ${CI_COMMIT_SHA}
      HARBOR_USERNAME:
        from_secret: harbor_app_push_username
      HARBOR_PASSWORD:
        from_secret: harbor_app_push_password
    commands:
      - node .unfogy/scripts/verify-harbor-scan.mjs
