when:
  - event: manual

steps:
  - name: canary-image
    image: woodpeckerci/plugin-docker-buildx@sha256:0a8e69cad4a25d641bdb51daea53ce309692c7bda1193ae04a990bb88486edd8
    dns: 10.77.30.1
    privileged: true
    settings:
      custom_dns: 10.77.30.1
      registry: registry.unfogy.com
      repo: registry.unfogy.com/unfogy-canary/runtime
      tags:
        - ${CI_COMMIT_SHA}
      context: deploy/canary
      dockerfile: deploy/canary/Dockerfile
      platforms: linux/amd64
      provenance: mode=max
      build_args: BUILD_REVISION=${CI_COMMIT_SHA}
      cache_images:
        - registry.unfogy.com/unfogy-canary/cache-canary
      username:
        from_secret: harbor_canary_push_username
      password:
        from_secret: harbor_canary_push_password
